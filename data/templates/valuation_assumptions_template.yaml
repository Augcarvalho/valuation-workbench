# Valuation assumptions template.
# Copy to data_private/assumptions/<company_id>.yaml (replace ":" with "_" in
# the filename, e.g. NASDAQ:LULU -> NASDAQ_LULU.yaml) and adjust.
# Everything is optional: missing keys fall back to anchors derived from the
# company's own TTM data ("auto"), and missing scenarios are auto-derived.
# Private assumptions are never committed (data_private/ is gitignored).
#
# Glidepath specs: "auto" | scalar | [per-year list] | {start: x|auto, end: y}

# Disclosure status shown on every output: illustrative | draft | final.
# Anything not "final" renders with a visible not-a-final-view banner.
status: draft

horizon_years: 5
# "auto" appends a disclosed fade period when the detailed forecast has not
# reached stable growth. Set an integer only when the transition is modeled
# explicitly; zero is allowed but an abrupt terminal jump will be flagged.
transition_years: auto

scenarios:
  base:
    revenue_growth: {start: auto, end: 0.04}   # fade from current growth to 4%
    ebitda_margin: {start: auto, end: auto}    # hold TTM margin
    d_and_a_pct_revenue: auto
    capex_pct_revenue: {start: auto, end: 0.03}
    tax_rate: auto                             # from wacc_params by currency
    dso: auto                                  # working-capital days glidepaths
    dih: auto
    dpo: auto
  bear:
    revenue_growth: {start: 0.00, end: 0.01}
    ebitda_margin: {start: auto, end: 0.12}
  bull:
    revenue_growth: {start: 0.18, end: 0.06}
    ebitda_margin: {start: auto, end: 0.20}

wacc:
  beta: auto                    # manual override, e.g. 0.9
  pretax_cost_of_debt: auto     # else derived from interest expense / debt
  wacc_override: null           # hard override; use sparingly and disclose

terminal:
  exit_multiple: auto           # else peer-group median EV/EBITDA
  perpetuity_growth: auto       # else currency default from wacc_params.csv
  roic: auto                    # stable ROIC; reinvestment rate = perpetuity growth / ROIC
  wacc: auto                    # stable-state WACC; auto converges beta/capital structure

# --- Business-model operating drivers (optional) ------------------------------
# The application pre-fills the profile assigned to the selected company. Tier 3
# uses physical KPIs loaded through operating_kpis.csv; Tier 2 uses reported
# Capital IQ segments; Tier 1 retains reviewed consolidated revenue growth.
# Capital IQ operating-statistic mnemonics vary by issuer. Verify each one in
# Formula Builder and keep the private mapping in
# data_private/operating_kpi_config.csv.
#
# Example for an omnichannel retailer. When calibrate_to_consolidated is false,
# these paths, rather than the top-down revenue_growth path, drive DCF revenue.
# operating_drivers:
#   enabled: true
#   model: retail_omnichannel
#   review_status: reviewed
#   calibrate_to_consolidated: false
#   review_note: "Cross-checked to the latest filing and management guidance."
#   scenarios:
#     base:
#       net_store_adds: [20, 25, 30, 30, 30]
#       store_productivity_growth: [-0.04, 0.01, 0.02, 0.025, 0.025]
#       ecommerce_growth: [-0.01, 0.03, 0.04, 0.05, 0.05]
#       other_growth: [0.02, 0.03, 0.04, 0.04, 0.04]

# --- Tier-2 operational drivers (optional) -------------------------------------
# When present, REVENUE is built from physical drivers per segment
# (units x revenue/unit, store-based or segment-based style) instead of % growth.
# Margins/capex/working capital still come from the scenario drivers above.
# unit_adds and rpu_growth accept a scalar, a per-year list, or a bear/base/bull map.
#
# segments:
#   # Alternatively set `segments: auto` to use the locally extracted Capital
#   # IQ segment mix. Omitted segments preserve manual revenue-growth paths.
#   - name: Cash-and-carry
#     units: 108                # current unit count (stores, reps, clinics...)
#     revenue_per_unit: 235.5   # in the same currency-millions as the model
#     unit_adds: {bear: 10, base: 18, bull: 30}
#     rpu_growth: 0.01
#   - name: Retail
#     units: 85
#     revenue_per_unit: 107.0
#     unit_adds: [7, 7, 8, 8, 8]
#     rpu_growth: 0.01
